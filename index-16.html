<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b0d">
<title>NOTES — Your world</title>
<style>
:root{--bg:#09090b;--panel:#141417;--panel2:#1b1b20;--line:#29292f;--red:#ff3048;--text:#f6f6f8;--muted:#a2a2ad}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#251016 0,#09090b 42%);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 14px;background:var(--red);color:#fff;font-weight:700}button.secondary{background:#25252b;border:1px solid var(--line)}button.ghost{background:transparent;color:var(--muted);padding:8px}button:disabled{opacity:.5;cursor:not-allowed}input,textarea,select{width:100%;background:#0d0d10;color:var(--text);border:1px solid #34343b;border-radius:12px;padding:12px;outline:none}input:focus,textarea:focus{border-color:var(--red)}textarea{resize:vertical;min-height:85px}.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:12px}.brand{font-size:28px;font-weight:950;letter-spacing:2px}.brand span{color:var(--red)}.wrap{max-width:1080px;margin:auto;padding:18px 16px 100px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}.topsearch{max-width:420px}.panel{background:rgba(20,20,23,.96);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 10px 35px #0002}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grow{flex:1;min-width:0}.avatar{width:42px;height:42px;flex-shrink:0;border-radius:50%;object-fit:cover;background:#32121a;border:1px solid #51202b;display:grid;place-items:center;font-weight:900;color:#ff9aa7;overflow:hidden}.avatar.big{width:76px;height:76px;font-size:24px}.avatar img{width:100%;height:100%;object-fit:cover}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;gap:2px;padding:8px 5px calc(8px + env(safe-area-inset-bottom));background:#101013f5;border-top:1px solid var(--line);backdrop-filter:blur(18px)}.tab{background:transparent;color:var(--muted);border-radius:12px;padding:7px 9px;min-width:53px;font-size:11px}.tab b{display:block;font-size:20px}.tab.active{background:#36121a;color:#fff}.tab.active b{color:var(--red)}.section-title{font-size:22px;font-weight:850;margin:8px 0 14px}.post-img{width:100%;max-height:560px;object-fit:contain;background:#080809;border-radius:14px;margin-top:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.pill{display:inline-block;background:#2a1218;color:#ff9aa7;border:1px solid #4a1b25;padding:5px 9px;border-radius:99px;font-size:12px}.cols{display:grid;grid-template-columns:1fr;gap:12px}.userrow{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:14px;background:#101013}.chatlist{display:grid;gap:8px}.chatitem{text-align:left;display:flex;align-items:center;gap:10px;background:#111114;border:1px solid var(--line);color:white;width:100%}.chatbox{display:flex;flex-direction:column;height:min(55vh,520px)}.messages{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:10px 0}.bubble{max-width:82%;padding:10px 12px;background:#25252b;border-radius:14px;align-self:flex-start;overflow-wrap:anywhere}.bubble.mine{background:#651526;align-self:flex-end}.sendrow{display:flex;gap:8px}.sendrow input{flex:1}.game-card{background:linear-gradient(135deg,#211116,#17171c);border:1px solid #43202a;border-radius:16px;padding:16px}.game-icon{font-size:30px}.auth{min-height:100dvh;display:grid;place-items:center;padding:18px}.authcard{width:min(100%,420px);background:#121215;border:1px solid #3a252b;border-radius:24px;padding:24px;box-shadow:0 20px 80px #0008}.authcard h1{margin:6px 0}.authform{display:grid;gap:12px}.notice{background:#231c12;border:1px solid #5b421c;color:#f3d9a3;border-radius:12px;padding:11px;font-size:12px}.socials{display:flex;gap:8px;flex-wrap:wrap}.socials a{background:#211116;padding:8px 11px;border-radius:10px;color:#ff8d9b;text-decoration:none;border:1px solid #48202a}.profile-cover{height:100px;border-radius:14px;background:linear-gradient(120deg,#3c0e19,#16161b 60%,#641327);margin-bottom:-42px}.profile-head{padding:0 8px 10px}.profile-click{cursor:pointer}.empty{text-align:center;padding:30px 10px;color:var(--muted)}.gameboard{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:300px;margin:14px auto}.cell{aspect-ratio:1;background:#24242a;border:1px solid #45454e;font-size:32px}.notice2{border-top:1px solid var(--line);margin-top:16px;padding-top:12px}.stack{display:grid;gap:10px}.wide{width:100%}
@media(min-width:760px){.wrap{padding-top:26px}.main-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(250px,1fr);gap:14px}.cols{grid-template-columns:repeat(2,minmax(0,1fr))}.tabs{top:0;bottom:auto;left:auto;right:auto;position:static;justify-content:flex-start;background:transparent;border:0;padding:0;margin:10px 0 20px}.tab{min-width:75px;font-size:12px}.wrap{padding-bottom:30px}}

<body>
<div id="auth" class="auth"><div class="authcard"><div class="brand">N<span>O</span>TES</div><p class="muted">Your people. Your posts. Your world.</p><div class="row" style="margin:18px 0"><button id="loginMode" class="grow">Log in</button><button id="registerMode" class="secondary grow">Register</button></div><form id="authForm" class="authform"><input id="authId" autocomplete="username" placeholder="Username / unique ID" required maxlength="24"><input id="authName" class="hidden" placeholder="Display name" maxlength="40"><input id="authPass" type="password" autocomplete="current-password" placeholder="Password" required minlength="4"><input id="authConfirm" class="hidden" type="password" placeholder="Confirm password" minlength="4"><button id="authSubmit">Log in</button><div id="authError" class="muted small"></div></form><p class="notice">Local demo only: accounts and content are saved in this browser on this device. There is no email or phone verification. Do not use a real or reused password.</p></div></div>
<div id="app" class="hidden"><div class="wrap"><header class="top"><div class="brand">N<span>O</span>TES</div><input id="globalSearch" class="topsearch" placeholder="⌕ Search notes and people…"><button id="topSearchBtn" class="secondary">Search</button></header><nav class="tabs" id="tabs"><button class="tab active" data-page="home"><b>⌂</b>Home</button><button class="tab" data-page="chat"><b>▤</b>Chat</button><button class="tab" data-page="games"><b>♟</b>Games</button><button class="tab" data-page="social"><b>↗</b>Social</button><button class="tab" data-page="profile"><b>◉</b>Profile</button></nav><main id="page"></main><footer class="muted small" style="text-align:center;padding:16px">NOTES demo · Browser-local data · <span id="signedInAs"></span></footer></div></div>
<input id="imageFile" type="file" accept="image/*" class="hidden">
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const DB='notes_demo_v1',SESSION='notes_demo_session';let mode='login',page='home',activeChat='global',viewedUser=null,searchTerm='',tic={},pendingImage=null;
function freshDB(){return{users:{},posts:[],chats:{global:[]},groups:[],likes:{}}}function loadDB(){try{return JSON.parse(localStorage.getItem(DB))||freshDB()}catch{return freshDB()}}let db=loadDB(),userId=localStorage.getItem(SESSION)||null;
function save(){try{localStorage.setItem(DB,JSON.stringify(db))}catch(e){alert('Browser storage is full. Try smaller images or delete old posts.')}}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function me(){return db.users[userId]}function avatar(u,big=false){return `<div class="avatar ${big?'big':''}">${u?.photo?`<img src="${u.photo}" alt="">`:esc((u?.name||u?.id||'?').slice(0,1).toUpperCase())}</div>`}function time(t){return new Date(t).toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}function setMode(m){mode=m;$('#loginMode').className=m==='login'?'grow':'secondary grow';$('#registerMode').className=m==='register'?'grow':'secondary grow';$('#authName').classList.toggle('hidden',m!=='register');$('#authConfirm').classList.toggle('hidden',m!=='register');$('#authSubmit').textContent=m==='login'?'Log in':'Create account';$('#authError').textContent=''}
$('#loginMode').onclick=()=>setMode('login');$('#registerMode').onclick=()=>setMode('register');$('#authForm').onsubmit=e=>{e.preventDefault();const id=$('#authId').value.trim().toLowerCase().replace(/\s+/g,'_'),pass=$('#authPass').value;$('#authError').textContent='';if(!/^[a-z0-9_.-]{3,24}$/.test(id))return $('#authError').textContent='Use 3–24 letters, numbers, dots, dashes or underscores.';if(mode==='register'){if(db.users[id])return $('#authError').textContent='That ID already exists in this browser.';if(pass!==$('#authConfirm').value)return $('#authError').textContent='Passwords do not match.';if(pass.length<4)return $('#authError').textContent='Password must be at least 4 characters.';db.users[id]={id,name:$('#authName').value.trim()||id,pass,photo:'',bio:'',instagram:'',youtube:'',created:Date.now()};db.chats[id]=[];save()}else if(!db.users[id]||db.users[id].pass!==pass)return $('#authError').textContent='Incorrect ID or password. Register first on this browser.';userId=id;localStorage.setItem(SESSION,id);start()};
function start(){if(!userId||!db.users[userId]){userId=null;$('#app').classList.add('hidden');$('#auth').classList.remove('hidden');return}$('#auth').classList.add('hidden');$('#app').classList.remove('hidden');$('#signedInAs').textContent='@'+userId;render()}function go(p){page=p;viewedUser=null;$$('.tab').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}$('#tabs').onclick=e=>{let b=e.target.closest('[data-page]');if(b)go(b.dataset.page)};$('#topSearchBtn').onclick=()=>{searchTerm=$('#globalSearch').value.trim().toLowerCase();go('search')};$('#globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter')$('#topSearchBtn').click()});
function render(){if(!userId)return;let root=$('#page');if(page==='home')root.innerHTML=home();else if(page==='search')root.innerHTML=searchPage();else if(page==='chat')root.innerHTML=chatPage();else if(page==='games')root.innerHTML=gamesPage();else if(page==='social')root.innerHTML=socialPage();else if(page==='profile')root.innerHTML=profilePage(userId,true);else if(page==='user')root.innerHTML=profilePage(viewedUser,false);wire()}
function home(){let posts=[...db.posts].sort((a,b)=>b.time-a.time);return `<div class="main-grid"><section><div class="section-title">Your feed <span class="pill">ALL USERS</span></div><div class="panel"><div class="row" style="align-items:flex-start">${avatar(me())}<div class="grow"><textarea id="postText" placeholder="Share a note with everyone…"></textarea></div></div><div class="row between" style="margin-top:10px"><span class="muted small">Thoughts, notes or an image</span><div class="row"><button class="secondary" id="pickImage">＋ Image</button><button id="publishPost">Post ↗</button></div></div><div id="selectedImageName" class="small muted"></div></div><div id="feed">${posts.length?posts.map(postCard).join(''):'<div class="panel empty">No notes yet. Be the first to post!</div>'}</div></section><aside><div class="panel"><div class="section-title">People on NOTES</div>${Object.values(db.users).filter(u=>u.id!==userId).slice(0,8).map(u=>`<div class="userrow" style="margin-bottom:8px">${avatar(u)}<div class="grow"><b>${esc(u.name)}</b><div class="muted small">@${esc(u.id)}</div></div><button class="secondary" data-profile="${esc(u.id)}">View</button></div>`).join('')||'<p class="muted">Create another demo account to preview other profiles.</p>'}</div><div class="panel"><b>Quick links</b><div class="actions"><button class="secondary" data-go="chat">Open chat</button><button class="secondary" data-go="games">Play games</button></div></div></aside></div>`}
function postCard(p){let u=db.users[p.user]||{id:p.user,name:p.user},liked=(db.likes[p.id]||[]).includes(userId);return `<article class="panel"><div class="row">${avatar(u)}<div class="grow"><b data-profile="${esc(u.id)}" class="profile-click">${esc(u.name)}</b><div class="muted small">@${esc(u.id)} · ${time(p.time)}</div></div>${p.user===userId?`<button class="ghost" data-deletepost="${esc(p.id)}">Delete</button>`:''}</div>${p.text?`<p style="white-space:pre-wrap">${esc(p.text)}</p>`:''}${p.image?`<img class="post-img" src="${p.image}" alt="Post image">`:''}<div class="actions"><button class="secondary" data-like="${esc(p.id)}">${liked?'♥':'♡'} ${(db.likes[p.id]||[]).length} Like</button><button class="secondary" data-comment="${esc(p.id)}">Comment</button><button class="secondary" data-message="${esc(p.user)}">Message</button></div><div id="comments-${esc(p.id)}">${(p.comments||[]).slice(-3).map(c=>`<p class="small"><b>${esc(db.users[c.user]?.name||c.user)}:</b> ${esc(c.text)}</p>`).join('')}</div></article>`}
function searchPage(){let q=searchTerm||$('#globalSearch').value.trim().toLowerCase(),people=Object.values(db.users).filter(u=>u.id.includes(q)||u.name.toLowerCase().includes(q)),posts=db.posts.filter(p=>(p.text||'').toLowerCase().includes(q)||(db.users[p.user]?.name||'').toLowerCase().includes(q)).sort((a,b)=>b.time-a.time);return `<div class="section-title">Search NOTES</div><div class="panel"><input id="searchAgain" value="${esc(q)}" placeholder="Search notes and people…"><button id="doSearch" style="margin-top:8px">Search</button></div><div class="panel"><h3>People</h3>${people.map(u=>`<div class="userrow" style="margin-bottom:8px">${avatar(u)}<div class="grow"><b>${esc(u.name)}</b><div class="muted small">@${esc(u.id)}</div></div><button class="secondary" data-profile="${esc(u.id)}">Profile</button><button data-message="${esc(u.id)}">Chat</button></div>`).join('')||'<p class="muted">No people found.</p>'}</div><h3>Notes</h3>${posts.map(postCard).join('')||'<div class="panel empty">No matching notes.</div>'}`}
function allChatIds(){return ['global',...db.groups.filter(g=>g.members.includes(userId)).map(g=>g.id),...Object.keys(db.users).filter(id=>id!==userId)]}function chatTitle(id){if(id==='global')return'Global chat';let g=db.groups.find(x=>x.id===id);return g?g.name:(db.users[id]?.name||id)}function chatPage(){let ids=allChatIds();if(!ids.includes(activeChat))activeChat='global';let msgs=db.chats[activeChat]||[];return `<div class="section-title">Chat <span class="pill">LOCAL DEMO</span></div><div class="cols"><section class="panel"><div class="row between"><h3>Conversations</h3><button id="newGroup" class="secondary">＋ Group</button></div><div class="chatlist">${ids.map(id=>`<button class="chatitem" data-chat="${esc(id)}">${avatar(id==='global'?{name:'G'}:db.users[id]||{name:chatTitle(id)})}<span class="grow"><b>${esc(chatTitle(id))}</b><div class="muted small">${id==='global'?'Everyone in this browser':db.groups.some(g=>g.id===id)?'Group chat':'Personal chat'}</div></span>${activeChat===id?'●':''}</button>`).join('')}</div><p class="muted small">All demo accounts on this browser share this local data. Other website visitors will not see it.</p></section><section class="panel"><div class="row"><div class="grow"><b>${esc(chatTitle(activeChat))}</b><div class="muted small">Messages saved locally</div></div><button id="inviteGame" class="secondary">Invite game</button></div><div class="chatbox"><div class="messages" id="messages">${msgs.map(m=>`<div class="bubble ${m.user===userId?'mine':''}"><div class="small" style="font-weight:800">${esc(db.users[m.user]?.name||m.user)}</div>${esc(m.text)}<div class="small muted" style="margin-top:4px">${time(m.time)}</div></div>`).join('')||'<div class="empty">Say hello 👋</div>'}</div><form id="sendForm" class="sendrow"><input id="messageText" placeholder="Write a message…" maxlength="1000" required><button>Send</button></form></div></section></div>`}
function gamesPage(){return `<div class="section-title">Game zone <span class="pill">PLAY & INVITE</span></div><p class="muted">Play Tic-Tac-Toe locally. Chess, Carrom, Ludo and UNO-style cards are lobby previews, not fully playable multiplayer games in this demo.</p><div class="cols">${[['♟','Chess','2 players'],['◉','Carrom','2 or 4 players'],['🎲','Ludo','2–4 players'],['🃏','UNO-style cards','2–4 players'],['⭕','Tic-Tac-Toe','2 players']].map(g=>`<div class="game-card"><div class="game-icon">${g[0]}</div><h3>${g[1]}</h3><span class="pill">${g[2]}</span><p class="muted small">${g[1]==='Tic-Tac-Toe'?'Play a quick game here.':'Open a lobby preview and invite people from chat.'}</p><button data-game="${g[1]}">${g[1]==='Tic-Tac-Toe'?'Play now':'Open lobby'}</button></div>`).join('')}</div><div id="gameArea"></div>`}
function socialPage(){return `<div class="section-title">Creator links</div><div class="panel"><h3>Share your channels</h3><p class="muted">Add your Instagram and YouTube links on your profile. Open any profile to view its social links.</p><button data-go="profile">Edit my links</button></div><div class="panel"><h3>People</h3>${Object.values(db.users).map(u=>`<div class="userrow" style="margin-bottom:8px">${avatar(u)}<div class="grow"><b>${esc(u.name)}</b><div class="muted small">@${esc(u.id)}</div></div><button class="secondary" data-profile="${esc(u.id)}">Open profile</button></div>`).join('')}</div>`}
function safeUrl(s){try{let u=new URL(s);return['https:','http:'].includes(u.protocol)?u.href:'#'}catch{return'#'}}function profilePage(id,own){let u=db.users[id];if(!u)return'<div class="panel">Profile not found.</div>';return `<div class="section-title">${own?'My profile':'Profile'}</div><div class="panel"><div class="profile-cover"></div><div class="profile-head row">${avatar(u,true)}<div class="grow" style="padding-top:42px"><h2 style="margin:0">${esc(u.name)}</h2><div class="muted">@${esc(u.id)}</div></div>${own?'':`<button data-message="${esc(u.id)}">Message</button>`}</div><p>${esc(u.bio||'No bio yet.')}</p><div class="socials">${u.instagram?`<a target="_blank" rel="noopener" href="${safeUrl(u.instagram)}">Instagram ↗</a>`:''}${u.youtube?`<a target="_blank" rel="noopener" href="${safeUrl(u.youtube)}">YouTube ↗</a>`:''}</div>${own?`<hr style="border-color:var(--line);margin:18px 0"><h3>Edit profile</h3><form id="profileForm" class="stack"><label class="small muted">Display name<input id="editName" value="${esc(u.name)}" maxlength="40" required></label><label class="small muted">Bio<textarea id="editBio" maxlength="180">${esc(u.bio||'')}</textarea></label><label class="small muted">Profile picture<input id="editPhoto" type="file" accept="image/*"></label><label class="small muted">Instagram URL<input id="editInstagram" value="${esc(u.instagram||'')}" placeholder="https://instagram.com/yourname"></label><label class="small muted">YouTube URL<input id="editYoutube" value="${esc(u.youtube||'')}" placeholder="https://youtube.com/@yourchannel"></label><button>Save profile</button></form><button id="logout" class="secondary wide" style="margin-top:12px">Log out</button><p class="muted small">Log out keeps your account and posts saved in this browser.</p>`:`<div class="actions"><button class="secondary" data-message="${esc(id)}">Start personal chat</button></div>`}</div><h3>Posts by ${esc(u.name)}</h3>${db.posts.filter(p=>p.user===id).sort((a,b)=>b.time-a.time).map(postCard).join('')||'<div class="panel empty">No posts yet.</div>'}`}
function wire(){let pick=$('#pickImage');if(pick)pick.onclick=()=>$('#imageFile').click();let pub=$('#publishPost');if(pub)pub.onclick=()=>{let text=$('#postText').value.trim();if(!text&&!pendingImage)return alert('Write something or choose an image.');db.posts.push({id:'p'+Date.now()+Math.random().toString(16).slice(2,6),user:userId,text,image:pendingImage,time:Date.now(),comments:[]});pendingImage=null;$('#imageFile').value='';save();render()};$$('[data-like]').forEach(b=>b.onclick=()=>{let id=b.dataset.like;db.likes[id]??=[];db.likes[id]=db.likes[id].includes(userId)?db.likes[id].filter(x=>x!==userId):[...db.likes[id],userId];save();render()});$$('[data-comment]').forEach(b=>b.onclick=()=>{let t=prompt('Write a comment');if(!t?.trim())return;let p=db.posts.find(x=>x.id===b.dataset.comment);p.comments??=[];p.comments.push({user:userId,text:t.trim(),time:Date.now()});save();render()});$$('[data-deletepost]').forEach(b=>b.onclick=()=>{if(confirm('Delete this post?')){db.posts=db.posts.filter(p=>p.id!==b.dataset.deletepost);delete db.likes[b.dataset.deletepost];save();render()}});$$('[data-profile]').forEach(b=>b.onclick=()=>{viewedUser=b.dataset.profile;page='user';$$('.tab').forEach(x=>x.classList.remove('active'));render()});$$('[data-message]').forEach(b=>b.onclick=()=>{let id=b.dataset.message;if(id===userId)return alert('That is your own profile.');activeChat=id;db.chats[id]??=[];go('chat')});$$('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));$$('[data-chat]').forEach(b=>b.onclick=()=>{activeChat=b.dataset.chat;render()});let ds=$('#doSearch');if(ds)ds.onclick=()=>{searchTerm=$('#searchAgain').value.trim().toLowerCase();render()};let sf=$('#sendForm');if(sf)sf.onsubmit=e=>{e.preventDefault();let t=$('#messageText').value.trim();if(!t)return;db.chats[activeChat]??=[];db.chats[activeChat].push({user:userId,text:t,time:Date.now()});save();render();$('#messages')?.scrollTo(0,99999)};let ng=$('#newGroup');if(ng)ng.onclick=()=>{let name=prompt('Group name?');if(!name?.trim())return;let others=Object.keys(db.users).filter(x=>x!==userId);let picked=prompt('Member IDs separated by commas. Available: '+(others.join(', ')||'no other demo accounts'),'');let members=[userId,...(picked||'').split(',').map(x=>x.trim().toLowerCase()).filter(x=>db.users[x]&&x!==userId)];let id='group_'+Date.now();db.groups.push({id,name:name.trim(),members});db.chats[id]=[];activeChat=id;save();render()};let inv=$('#inviteGame');if(inv)inv.onclick=()=>{let game=prompt('Which game? Chess, Carrom, Ludo, UNO or Tic-Tac-Toe','Ludo');if(game){db.chats[activeChat]??=[];db.chats[activeChat].push({user:userId,text:'🎮 Game invite: '+game+' — join me in NOTES!',time:Date.now()});save();render()}};let pf=$('#profileForm');if(pf)pf.onsubmit=async e=>{e.preventDefault();let u=me();u.name=$('#editName').value.trim()||u.id;u.bio=$('#editBio').value.trim();u.instagram=$('#editInstagram').value.trim();u.youtube=$('#editYoutube').value.trim();if(u.instagram&&!safeUrl(u.instagram).startsWith('http'))return alert('Enter a valid Instagram URL.');if(u.youtube&&!safeUrl(u.youtube).startsWith('http'))return alert('Enter a valid YouTube URL.');let f=$('#editPhoto').files[0];if(f){if(f.size>650000)return alert('Choose an image under 650 KB for this browser demo.');u.photo=await fileData(f)}save();render();alert('Profile saved.')};let lo=$('#logout');if(lo)lo.onclick=()=>{localStorage.removeItem(SESSION);userId=null;setMode('login');start()};$$('[data-game]').forEach(b=>b.onclick=()=>openGame(b.dataset.game))}
function fileData(f){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}$('#imageFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;if(f.size>650000){alert('Choose an image under 650 KB for this browser demo.');e.target.value='';return}pendingImage=await fileData(f);let n=$('#selectedImageName');if(n)n.textContent='Image ready: '+f.name};
function openGame(name){let area=$('#gameArea');if(!area)return;if(name==='Tic-Tac-Toe'){tic={board:Array(9).fill(''),turn:'X',over:false};area.innerHTML=`<div class="panel"><div class="row between"><h3>Tic-Tac-Toe</h3><button id="resetTic" class="secondary">Restart</button></div><p id="ticStatus" class="muted">X's turn</p><div id="ticBoard" class="gameboard">${tic.board.map((v,i)=>`<button class="cell" data-cell="${i}">${v}</button>`).join('')}</div><p class="muted small">Local two-player game on this device.</p></div>`;$('#resetTic').onclick=()=>openGame(name);$$('[data-cell]').forEach(b=>b.onclick=()=>{let i=+b.dataset.cell;if(tic.board[i]||tic.over)return;tic.board[i]=tic.turn;let wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]],won=wins.some(w=>w.every(j=>tic.board[j]===tic.turn));tic.over=won||tic.board.every(Boolean);let status=won?tic.turn+' wins!':tic.over?'Draw game':(tic.turn=tic.turn==='X'?'O':'X',tic.turn+"'s turn");$('#ticStatus').textContent=status;$$('[data-cell]').forEach((c,j)=>{c.textContent=tic.board[j];c.disabled=!!tic.board[j]||tic.over})})}else{area.innerHTML=`<div class="panel"><div class="row between"><h3>${esc(name)} lobby</h3><button class="ghost" id="closeGame">Close</button></div><p>This is a demo lobby only. Full online multiplayer gameplay needs a game engine and shared backend.</p><p class="muted">Invite someone through Chat to arrange a match.</p><button id="goChatFromGame">Open chat</button></div>`;$('#closeGame').onclick=()=>area.innerHTML='';$('#goChatFromGame').onclick=()=>{activeChat='global';go('chat')}}area.scrollIntoView({behavior:'smooth',block:'start'})}start();
})();
</script></body></html>
